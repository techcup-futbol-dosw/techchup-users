#  Base de datos H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:dosw_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

#  MongoDB deshabilitado en tests
spring.data.mongodb.auto-index-creation=false

#  JWT secret usado exclusivamente por los tests de contexto y seguridad
security.jwt.secret=bWktY2xhdmUtc3VwZXItc2VjcmV0YS1wYXJhLWp3dC0xMjM0NTY3ODkwMTIzNDU2
