# Base de datos PostgreSQL (Azure)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# MongoDB (fotos de jugadores)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT Configuration (Production)
# Falls back to the shared default secret if SECURITY_JWT_SECRET is not set in Azure
security.jwt.secret=${SECURITY_JWT_SECRET:bWktY2xhdmUtc3VwZXItc2VjcmV0YS1wYXJhLWp3dC0xMjM0NTY3ODkwMTIzNDU2}

# Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true