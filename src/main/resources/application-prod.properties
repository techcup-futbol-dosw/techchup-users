# Base de datos PostgreSQL (Azure)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# MongoDB (fotos de jugadores)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# JWT Configuration (Production)
# Reads SECURITY_JWT_SECRET first; falls back to JWT_SECRET (the var used by the Identity Service in Azure)
security.jwt.secret=${SECURITY_JWT_SECRET:${JWT_SECRET:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}

# Swagger UI
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true