# Nombre de la aplicacion
spring.application.name=DOSW-TechCup-users

#  JPA
spring.jpa.open-in-view=false

#  Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT secret — reads SECURITY_JWT_SECRET or JWT_SECRET (same var as Identity Service); falls back to identity-service local default
security.jwt.secret=${SECURITY_JWT_SECRET:${JWT_SECRET:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa}}