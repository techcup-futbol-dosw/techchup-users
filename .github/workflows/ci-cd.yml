name: CI/CD TechCup Users

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write
  packages: write   # necesario para publicar imagen en ghcr.io

# ─────────────────────────────────────────────────────────────────
#  Rama        | Build | Test | Calidad | Docker | Deploy
#  feature/**  |  Sí   |  Sí  |   Sí    |   No   |   No
#  develop     |  Sí   |  Sí  |   Sí    |   No   |   No
#  main        |  Sí   |  Sí  |   Sí    |   Sí   |   Sí
# ─────────────────────────────────────────────────────────────────

jobs:

  # ── 1. BUILD ──────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile
        run: mvn -B -ntp clean compile

  # ── 2. TEST ───────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: self-hosted
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests and check coverage (JaCoCo 85%)
        run: mvn -B -ntp verify

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 1

  # ── 3. QUALITY ────────────────────────────────────────────────────────────
  quality:
    name: Quality
    runs-on: self-hosted
    needs: test
    # SonarCloud failures must NOT block Docker/Deploy
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # requerido por SonarCloud para análisis de blame y código nuevo

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: SonarCloud analysis
        run: |
          mvn -B -ntp verify sonar:sonar `
            "-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}" `
            "-Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}" `
            "-Dsonar.host.url=https://sonarcloud.io" `
            "-Dsonar.coverage.exclusions=**/App.java,**/entity/**,**/enums/**,**/*MapperImpl.java,**/config/MongoConfig.java,**/security/LocalSecurityConfig.java" `
            "-Dsonar.exclusions=**/*MapperImpl.java"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ── 4. DOCKER (solo push a main) ──────────────────────────────────────────
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [test, quality]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  # ── 5. DEPLOY (solo push a main) ──────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ghcr.io/${{ github.repository }}:latest